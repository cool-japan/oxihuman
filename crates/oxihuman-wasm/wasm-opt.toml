# WASM optimization settings for oxihuman-wasm
#
# NOTE: Cargo does NOT read [profile.*] sections from arbitrary TOML files --
# only from the workspace root Cargo.toml (or a crate's own Cargo.toml for a
# non-workspace build). The actual opt-level="z" / lto=true / codegen-units=1
# release profile lives in the workspace root Cargo.toml's [profile.release]
# section. This file's job is the [wasm] budget below; it is not itself
# consumed by `cargo build`.

[wasm]
# Gzip'd size budget (bytes) for the release oxihuman_wasm_bg.wasm build.
#
# This is the single source of truth consumed by the "Gzip size gate" step
# in .github/workflows/npm-publish.yml -- change the budget here, not in
# the workflow. Measured as:
#   gzip -9 -c <pkg-dir>/oxihuman_wasm_bg.wasm | wc -c
#
# Last measured 2026-08-13 (Linux, rustc 1.97.1, `wasm-pack build --release
# --target web --no-default-features --features bindgen`, with the
# workspace root [profile.release] opt-level="z"/lto=true/codegen-units=1
# fix applied): 213,418 B gzip / 510,393 B raw. Budget below is that
# measurement + ~25% headroom, rounded to a clean number.
wasm_gzip_budget_bytes = 270_000
